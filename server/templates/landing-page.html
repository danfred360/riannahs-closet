<!doctype html>
<html>
  <head>
    <title>APP_NAME_PLACEHOLDER</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px 20px;
        text-align: center;
        background: linear-gradient(135deg, #FAF8F5 0%, #F5F0E8 100%);
        color: #222;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrapper {
        max-width: 400px;
        margin: 0 auto;
      }
      .app-icon {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        margin: 0 auto 24px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #111;
      }
      .tagline {
        font-size: 16px;
        color: #666;
        margin: 0 0 32px;
      }
      .store-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .store-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px 24px;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 12px;
        text-decoration: none;
        color: #fff;
        background: #111;
        transition: all 0.2s;
      }
      .store-button:hover {
        background: #333;
        transform: translateY(-2px);
      }
      .store-button.primary {
        background: linear-gradient(135deg, #B8A5A0 0%, #9A8478 100%);
      }
      .store-button.primary:hover {
        background: linear-gradient(135deg, #A89590 0%, #8A7468 100%);
      }
      .store-button.coming-soon {
        background: #ccc;
        color: #666;
        cursor: default;
        pointer-events: none;
      }
      .store-icon {
        width: 24px;
        height: 24px;
      }
      .coming-soon-badge {
        font-size: 11px;
        background: rgba(255,255,255,0.2);
        padding: 4px 8px;
        border-radius: 4px;
        margin-left: auto;
      }
      .web-link {
        margin-top: 24px;
        font-size: 14px;
        color: #666;
      }
      .web-link a {
        color: #111;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .web-link a:hover {
        color: #666;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
          color: #e0e0e0;
        }
        h1 {
          color: #f5f5f5;
        }
        .tagline {
          color: #999;
        }
        .store-button {
          background: #fff;
          color: #111;
        }
        .store-button:hover {
          background: #e0e0e0;
        }
        .store-button.coming-soon {
          background: #333;
          color: #666;
        }
        .web-link {
          color: #888;
        }
        .web-link a {
          color: #fff;
        }
        .web-link a:hover {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <img src="assets/images/icon.png" alt="APP_NAME_PLACEHOLDER" class="app-icon" />
      <h1>APP_NAME_PLACEHOLDER</h1>
      <p class="tagline">Your personal wardrobe companion</p>

      <div class="store-buttons" id="store-buttons">
        <a
          id="web-app-btn"
          href="BASE_URL_PLACEHOLDER"
          class="store-button primary"
        >
          <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          Open Web App
        </a>
      </div>

      <p class="web-link">
        Mobile apps coming soon to the App Store and Google Play
      </p>
    </div>

  </body>
</html>
