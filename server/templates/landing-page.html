<!doctype html>
<html>
  <head>
    <title>APP_NAME_PLACEHOLDER</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px 20px;
        text-align: center;
        background: linear-gradient(135deg, #FAF8F5 0%, #F5F0E8 100%);
        color: #222;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrapper {
        max-width: 400px;
        margin: 0 auto;
      }
      .app-icon {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        margin: 0 auto 24px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #111;
      }
      .tagline {
        font-size: 16px;
        color: #666;
        margin: 0 0 32px;
      }
      .store-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .store-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px 24px;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 12px;
        text-decoration: none;
        color: #fff;
        background: #111;
        transition: all 0.2s;
      }
      .store-button:hover {
        background: #333;
        transform: translateY(-2px);
      }
      .store-button.coming-soon {
        background: #ccc;
        color: #666;
        cursor: default;
        pointer-events: none;
      }
      .store-icon {
        width: 24px;
        height: 24px;
      }
      .coming-soon-badge {
        font-size: 11px;
        background: rgba(255,255,255,0.2);
        padding: 4px 8px;
        border-radius: 4px;
        margin-left: auto;
      }
      .web-link {
        margin-top: 24px;
        font-size: 14px;
        color: #666;
      }
      .web-link a {
        color: #111;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .web-link a:hover {
        color: #666;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
          color: #e0e0e0;
        }
        h1 {
          color: #f5f5f5;
        }
        .tagline {
          color: #999;
        }
        .store-button {
          background: #fff;
          color: #111;
        }
        .store-button:hover {
          background: #e0e0e0;
        }
        .store-button.coming-soon {
          background: #333;
          color: #666;
        }
        .web-link {
          color: #888;
        }
        .web-link a {
          color: #fff;
        }
        .web-link a:hover {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <img src="assets/images/icon.png" alt="APP_NAME_PLACEHOLDER" class="app-icon" />
      <h1>APP_NAME_PLACEHOLDER</h1>
      <p class="tagline">Your personal wardrobe companion</p>

      <div class="store-buttons" id="store-buttons">
        <a
          id="app-store-btn"
          href="IOS_APP_STORE_URL_PLACEHOLDER"
          class="store-button coming-soon"
        >
          <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
            />
          </svg>
          Download on the App Store
          <span class="coming-soon-badge">Coming Soon</span>
        </a>
        <a
          id="play-store-btn"
          href="ANDROID_PLAY_STORE_URL_PLACEHOLDER"
          class="store-button coming-soon"
        >
          <svg class="store-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"
            />
          </svg>
          Get it on Google Play
          <span class="coming-soon-badge">Coming Soon</span>
        </a>
      </div>

      <p class="web-link">
        Or use the <a href="BASE_URL_PLACEHOLDER">web version</a> on your computer
      </p>
    </div>

    <script>
      (function () {
        const ua = navigator.userAgent;
        const isAndroid = /Android/i.test(ua);
        const isIOS =
          /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        const appStoreBtn = document.getElementById("app-store-btn");
        const playStoreBtn = document.getElementById("play-store-btn");

        // Show platform-appropriate button first
        if (isIOS) {
          playStoreBtn.style.display = "none";
        } else if (isAndroid) {
          appStoreBtn.style.display = "none";
        }

        // Enable buttons when store URLs are set (not placeholder)
        const iosUrl = appStoreBtn.getAttribute("href");
        const androidUrl = playStoreBtn.getAttribute("href");
        
        if (iosUrl && !iosUrl.includes("PLACEHOLDER")) {
          appStoreBtn.classList.remove("coming-soon");
          appStoreBtn.querySelector(".coming-soon-badge").style.display = "none";
        }
        
        if (androidUrl && !androidUrl.includes("PLACEHOLDER")) {
          playStoreBtn.classList.remove("coming-soon");
          playStoreBtn.querySelector(".coming-soon-badge").style.display = "none";
        }
      })();
    </script>
  </body>
</html>
