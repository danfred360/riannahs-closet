<!doctype html>
<html>
  <head>
    <title>Support - APP_NAME_PLACEHOLDER</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px 20px;
        text-align: center;
        background: linear-gradient(135deg, #FAF8F5 0%, #F5F0E8 100%);
        color: #222;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrapper {
        max-width: 500px;
        margin: 0 auto;
      }
      .app-icon {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        margin: 0 auto 20px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.1);
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 12px;
        color: #111;
      }
      .subtitle {
        font-size: 16px;
        color: #666;
        margin: 0 0 32px;
      }
      .support-card {
        background: #fff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        margin-bottom: 24px;
      }
      .support-card h2 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
        color: #111;
      }
      .support-card p {
        font-size: 15px;
        color: #555;
        margin: 0 0 20px;
      }
      .email-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 10px;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, #B8A5A0 0%, #9A8478 100%);
        transition: all 0.2s;
      }
      .email-link:hover {
        background: linear-gradient(135deg, #A89590 0%, #8A7468 100%);
        transform: translateY(-2px);
      }
      .email-icon {
        width: 20px;
        height: 20px;
      }
      .back-link {
        display: inline-block;
        color: #666;
        text-decoration: none;
        font-size: 14px;
        margin-top: 8px;
      }
      .back-link:hover {
        color: #333;
        text-decoration: underline;
      }
      .response-time {
        font-size: 13px;
        color: #888;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <img
        src="/assets/images/icon.png"
        alt="APP_NAME_PLACEHOLDER"
        class="app-icon"
      />
      <h1>Support</h1>
      <p class="subtitle">We're here to help</p>

      <div class="support-card">
        <h2>Need Assistance?</h2>
        <p>
          If you have questions, feedback, or need help with the app, 
          please reach out to our support team. We'd love to hear from you.
        </p>
        <a href="mailto:support@riannahscloset.com" class="email-link">
          <svg class="email-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          Email Support
        </a>
        <p class="response-time">We typically respond within 24-48 hours</p>
      </div>

      <a href="/" class="back-link">Back to Home</a>
    </div>
  </body>
</html>
